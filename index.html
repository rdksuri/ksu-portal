<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b232b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KSU Portal">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>KSU Web-Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: kleine Kopfzeile, darunter ein dichtes Raster aus quadratischen Kacheln (Symbol und Titel), auf dem Handy 3 Spalten. */
:root {
  --bg: #f3f4f6;
  --surface: #ffffff;
  --fg: #1b232c;
  --muted: #5b6672;
  --line: #d9dde2;
  --accent: #b3261e;
  --chip-map: #dfe9f2;
  --chip-edu: #f1e6df;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Sans 3", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c;
    --surface: #1b232b;
    --fg: #e8ecf0;
    --muted: #9aa6b2;
    --line: #2d3843;
    --accent: #ff7b72;
    --chip-map: #22303d;
    --chip-edu: #33282a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c;
  --surface: #1b232b;
  --fg: #e8ecf0;
  --muted: #9aa6b2;
  --line: #2d3843;
  --accent: #ff7b72;
  --chip-map: #22303d;
  --chip-edu: #33282a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-block: 20px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

header { display: flex; flex-direction: column; gap: 2px; }
.org { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 22px; line-height: 1.2; margin: 0; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.tile {
  aspect-ratio: 1 / 1; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  padding: 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  color: inherit; text-decoration: none; text-align: center;
}
.tile:hover { border-color: var(--accent); }
.tile:active { transform: scale(.97); }
.sym { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.sym svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.sym.map { background: var(--chip-map); }
.sym.edu { background: var(--chip-edu); }
.name { font-size: 14px; font-weight: 600; line-height: 1.2; hyphens: auto; overflow-wrap: anywhere; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light dark; }
body { margin: 0; }
</style>


</head>
<body>
<div class="wrap" lang="de">
  <header>
    <span class="org">Rettungsdienst Kantonsspital Uri</span>
    <h1>Web-Portal</h1>
  </header>
  <nav class="grid" id="grid" aria-label="Seiten und Anwendungen"></nav>
</div>

<script>
var ICONS = {
  map: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 12l12-4 12 4 12-4v28l-12 4-12-4-12 4z"/><path d="M18 8v28M30 12v28"/></svg>',
  edu: '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="6" width="28" height="36" rx="3"/><path d="M17 16h14M17 23h14M17 30h8"/></svg>',
  ops: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6l18 32H6z"/><path d="M24 19v9M24 33v1"/></svg>'
};

/* Neue Seite: hier einen Eintrag ergänzen (titel, icon, band, url). */
var SEITEN = [
  { titel: "Einsatzleitung Live", icon: "ops", band: "map", url: "https://einsatzleitung.onrender.com/" },
  { titel: "Strassen­sperrungen", icon: "map", band: "map", url: "https://rdksuri.github.io/strassensperrungen-karte/" },
  { titel: "Praktikum im Rettungsdienst", icon: "edu", band: "edu", url: "https://rdksuri.github.io/praktikum/" }
];

var grid = document.getElementById("grid");
SEITEN.forEach(function (s) {
  var a = document.createElement("a");
  a.className = "tile";
  a.href = s.url; a.target = "_blank"; a.rel = "noopener";
  var sym = document.createElement("span");
  sym.className = "sym " + s.band;
  sym.innerHTML = ICONS[s.icon] || "";
  var name = document.createElement("span");
  name.className = "name";
  name.textContent = s.titel;
  a.appendChild(sym); a.appendChild(name);
  grid.appendChild(a);
});
</script>
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
</html>
